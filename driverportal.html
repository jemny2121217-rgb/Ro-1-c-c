<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rydo Driver Portal</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    header p {
      color: #cbd5e1;
    }

    .status-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .online-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .status-text {
      font-size: 18px;
      font-weight: bold;
    }

    .toggle {
      border: none;
      border-radius: 30px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .toggle.online {
      background: #16a34a;
      color: white;
    }

    .toggle.offline {
      background: #6b7280;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fef3c7;
      color: #92400e;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .section-title {
      font-size: 21px;
      margin: 25px 0 12px;
    }

    .ride {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .ride-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .vehicle {
      font-weight: bold;
      font-size: 17px;
    }

    .fare {
      font-weight: bold;
      font-size: 18px;
    }

    .ride-row {
      margin-bottom: 10px;
    }

    .ride-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 3px;
    }

    .ride-value {
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.action {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .complete {
      background: #7c3aed;
      color: white;
    }

    .refresh {
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 14px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .driver-info {
      margin-top: 10px;
      font-size: 13px;
      color: #cbd5e1;
      word-break: break-all;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 16px;
      }

      header h1 {
        font-size: 23px;
      }

      .online-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🚗 Rydo Driver</h1>
      <p>Driver Portal</p>
      <div id="driverInfo" class="driver-info">
        Checking driver session...
      </div>
    </header>

    <!-- ONLINE / OFFLINE -->
    <div class="status-card">

      <div class="online-row">

        <div>
          <div id="statusText" class="status-text">
            🟢 Online
          </div>

          <div style="margin-top:5px;color:#6b7280;">
            Receive new ride requests
          </div>
        </div>

        <button
          id="onlineToggle"
          class="toggle online"
          onclick="toggleOnline()">
          Go Offline
        </button>

      </div>

      <div id="offlineMessage" class="message">
        You are offline. You will not receive new ride requests.
      </div>

    </div>


    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          Today's Earnings
        </div>

        <div id="todayEarnings" class="stat-value">
          Rs 0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Completed Rides
        </div>

        <div id="completedRides" class="stat-value">
          0
        </div>
      </div>

    </div>


    <!-- SYSTEM MESSAGE -->
    <div
      id="systemMessage"
      class="message">
    </div>


    <!-- REQUESTED RIDES -->
    <h2 class="section-title">
      Ride Requests
    </h2>

    <div id="rideRequests">
      <div class="loading">
        Loading rides...
      </div>
    </div>


    <!-- ACTIVE RIDE -->
    <h2 class="section-title">
      Active Ride
    </h2>

    <div id="activeRide">
      <div class="empty">
        No active ride
      </div>
    </div>


    <!-- REFRESH -->
    <div style="margin-top:20px;">

      <button
        class="action refresh"
        onclick="loadRides()">
        🔄 Refresh Rides
      </button>

    </div>

  </div>


<script>

/* =========================================================
   1. SUPABASE CONFIG
   ========================================================= */

/*
  IMPORTANT:

  Put your real Supabase project URL here.

  Example:
  https://xxxxxxxx.supabase.co
*/

const SUPABASE_URL =
  https://pdfgqlvovmyzhdnumypq.supabase.co/rest/v1/


/*
  Put your Supabase ANON/PUBLISHABLE KEY here.

  NEVER put your SERVICE_ROLE/SECRET KEY here.
*/

const SUPABASE_ANON_KEY =
  sb_publishable_cZnuDJwbDbtF2dDJ_M6rCg_-e-nWdMX


/* =========================================================
   2. CREATE SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;

if (
  SUPABASE_URL !== "PASTE_YOUR_SUPABASE_URL_HERE" &&
  SUPABASE_ANON_KEY !==
  "PASTE_YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE"
) {

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

}


/* =========================================================
   3. DRIVER STATE
   ========================================================= */

let driverState = {

  isOnline: true,

  driverId: null,

  activeRide: null,

  todayEarnings: 0,

  completedRides: 0

};


/* =========================================================
   4. PAGE START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init() {

  updateOnlineUI();

  if (!supabaseClient) {

    showMessage(
      "Supabase is not configured yet. Add your Supabase URL and ANON/PUBLISHABLE key in this file.",
      "error"
    );

    document.getElementById("driverInfo").textContent =
      "Supabase configuration required";

    return;
  }


  await checkDriver();

}


/* =========================================================
   5. CHECK DRIVER LOGIN
   ========================================================= */

async function checkDriver() {

  try {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();


    if (error) {
      throw error;
    }


    const user = data.user;


    if (!user) {

      driverState.driverId = null;

      document.getElementById("driverInfo").textContent =
        "No driver session. Driver login will be added later.";

      showMessage(
        "No authenticated driver session. The ride database is protected by Supabase authentication.",
        "error"
      );

      document.getElementById("rideRequests").innerHTML =
        `
        <div class="empty">
          Driver login is required to load ride requests.
        </div>
        `;

      return;
    }


    driverState.driverId = user.id;


    document.getElementById("driverInfo").textContent =
      "Driver ID: " + user.id;


    showMessage(
      "Driver connected to Supabase successfully.",
      "success"
    );


    await loadRides();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Supabase authentication error: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   6. LOAD REQUESTED RIDES
   ========================================================= */

async function loadRides() {

  if (!supabaseClient) {
    return;
  }


  if (!driverState.driverId) {

    document.getElementById("rideRequests").innerHTML =
      `
      <div class="empty">
        No authenticated driver.
      </div>
      `;

    return;
  }


  const container =
    document.getElementById("rideRequests");


  container.innerHTML =
    `
    <div class="loading">
      Loading ride requests...
    </div>
    `;


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("rides")

      .select("*")

      .eq("status", "requested")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {
      throw error;
    }


    renderRequestedRides(data || []);


    await loadActiveRide();

  }

  catch (error) {

    console.error(error);

    container.innerHTML =
      `
      <div class="message error show">
        Failed to load rides:<br>
        ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/* =========================================================
   7. SHOW REQUESTED RIDES
   ========================================================= */

function renderRequestedRides(rides) {

  const container =
    document.getElementById("rideRequests");


  if (!rides.length) {

    container.innerHTML =
      `
      <div class="empty">
        🚗 No ride requests right now.
      </div>
      `;

    return;
  }


  container.innerHTML =
    rides.map(
      ride => {

        return `
        <div class="ride">

          <div class="ride-header">

            <div class="vehicle">
              ${escapeHtml(
                ride.vehicle_type || "Vehicle"
              )}
            </div>

            <div class="fare">
              Rs ${Number(
                ride.fare || 0
              ).toFixed(0)}
            </div>

          </div>


          <div class="ride-row">

            <div class="ride-label">
              PICKUP
            </div>

            <div class="ride-value">
              📍 ${escapeHtml(
                ride.pickup_location || "-"
              )}
            </div>

          </div>


          <div class="ride-row">

            <div class="ride-label">
              DESTINATION
            </div>

            <div class="ride-value">
              🏁 ${escapeHtml(
                ride.destination || "-"
              )}
            </div>

          </div>


          <div class="ride-row">

            <div class="ride-label">
              DISTANCE
            </div>

            <div class="ride-value">
              ${Number(
                ride.distance_km || 0
              ).toFixed(2)} km
            </div>

          </div>


          <div class="buttons">

            <button
              class="action accept"
              onclick="acceptRide('${String(ride.id)}')">

              Accept Ride

            </button>

          </div>

        </div>
        `;

      }
    ).join("");

}


/* =========================================================
   8. ACCEPT RIDE
   ========================================================= */

async function acceptRide(rideId) {

  if (!driverState.driverId) {

    showMessage(
      "Driver login is required before accepting a ride.",
      "error"
    );

    return;
  }


  try {

    showMessage(
      "Accepting ride...",
      "success"
    );


    /*
      We only accept if the ride is still requested.

      This prevents two drivers from accepting
      the same ride at the same time.
    */

    const {
      data,
      error
    } = await supabaseClient

      .from("rides")

      .update({

        driver_id: driverState.driverId,

        status: "accepted"

      })

      .eq("id", rideId)

      .eq("status", "requested")

      .select()
      .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      showMessage(
        "This ride was already accepted by another driver.",
        "error"
      );

      await loadRides();

      return;
    }


    driverState.activeRide = data;


    showMessage(
      "Ride accepted successfully!",
      "success"
    );


    await loadRides();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Could not accept ride: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   9. LOAD ACTIVE RIDE
   ========================================================= */

async function loadActiveRide() {

  if (!driverState.driverId) {
    return;
  }


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("rides")

      .select("*")

      .eq(
        "driver_id",
        driverState.driverId
      )

      .in(
        "status",
        [
          "accepted",
          "in_progress"
        ]
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      )

      .limit(1)
      .maybeSingle();


    if (error) {
      throw error;
    }


    driverState.activeRide = data || null;


    renderActiveRide();

  }

  catch (error) {

    console.error(error);

    document.getElementById("activeRide").innerHTML =
      `
      <div class="message error show">
        Could not load active ride:
        ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/* =========================================================
   10. SHOW ACTIVE RIDE
   ========================================================= */

function renderActiveRide() {

  const container =
    document.getElementById("activeRide");


  const ride =
    driverState.activeRide;


  if (!ride) {

    container.innerHTML =
      `
      <div class="empty">
        No active ride
      </div>
      `;

    return;
  }


  let actionButton = "";


  if (ride.status === "accepted") {

    actionButton =
      `
      <button
        class="action start"
        onclick="startRide('${String(ride.id)}')">

        ▶ Start Ride

      </button>
      `;

  }


  if (ride.status === "in_progress") {

    actionButton =
      `
      <button
        class="action complete"
        onclick="completeRide('${String(ride.id)}')">

        ✓ Complete Ride

      </button>
      `;

  }


  container.innerHTML =
    `
    <div class="ride">

      <div class="ride-header">

        <div class="vehicle">
          ${escapeHtml(
            ride.vehicle_type || "Vehicle"
          )}
        </div>

        <div class="fare">
          Rs ${Number(
            ride.fare || 0
          ).toFixed(0)}
        </div>

      </div>


      <div class="ride-row">

        <div class="ride-label">
          STATUS
        </div>

        <div class="ride-value">
          ${escapeHtml(
            ride.status
          )}
        </div>

      </div>


      <div class="ride-row">

        <div class="ride-label">
          PICKUP
        </div>

        <div class="ride-value">
          📍 ${escapeHtml(
            ride.pickup_location || "-"
          )}
        </div>

      </div>


      <div class="ride-row">

        <div class="ride-label">
          DESTINATION
        </div>

        <div class="ride-value">
          🏁 ${escapeHtml(
            ride.destination || "-"
          )}
        </div>

      </div>


      <div class="ride-row">

        <div class="ride-label">
          DISTANCE
        </div>

        <div class="ride-value">
          ${Number(
            ride.distance_km || 0
          ).toFixed(2)} km
        </div>

      </div>


      <div class="buttons">

        ${actionButton}

      </div>

    </div>
    `;

}


/* =========================================================
   11. START RIDE
   ========================================================= */

async function startRide(rideId) {

  if (!driverState.driverId) {
    return;
  }


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("rides")

      .update({

        status: "in_progress"

      })

      .eq("id", rideId)

      .eq(
        "driver_id",
        driverState.driverId
      )

      .eq(
        "status",
        "accepted"
      )

      .select()
      .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      showMessage(
        "Ride could not be started.",
        "error"
      );

      return;
    }


    driverState.activeRide = data;


    showMessage(
      "Ride started.",
      "success"
    );


    renderActiveRide();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Could not start ride: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   12. COMPLETE RIDE
   ========================================================= */

async function completeRide(rideId) {

  if (!driverState.driverId) {
    return;
  }


  try {

    const {
      data,
      error
    } = await supabaseClient

      .from("rides")

      .update({

        status: "completed"

      })

      .eq("id", rideId)

      .eq(
        "driver_id",
        driverState.driverId
      )

      .eq(
        "status",
        "in_progress"
      )

      .select()
      .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      showMessage(
        "Ride could not be completed.",
        "error"
      );

      return;
    }


    /*
      Rydo driver receives 85%.
      Platform receives 15%.
    */

    const fare =
      Number(data.fare || 0);


    const driverEarning =
      fare * 0.85;


    driverState.todayEarnings +=
      driverEarning;


    driverState.completedRides += 1;


    driverState.activeRide = null;


    updateStats();


    showMessage(
      "Ride completed! Driver earned Rs " +
      driverEarning.toFixed(2),
      "success"
    );


    renderActiveRide();


    await loadRides();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Could not complete ride: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   13. ONLINE / OFFLINE
   ========================================================= */

function toggleOnline() {

  driverState.isOnline =
    !driverState.isOnline;


  updateOnlineUI();


  if (driverState.isOnline) {
