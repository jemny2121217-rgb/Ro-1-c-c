<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rydo — Move your way.</title>
  <meta name="description" content="Rydo — Move your way. A modern, professional ride-booking platform." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="Rydo homepage">
        <svg class="brand-mark" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0%" stop-color="#0066ff"/>
              <stop offset="100%" stop-color="#00d4ff"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="45" fill="url(#g1)" />
          <path d="M30 60 L40 40 L60 40 L70 60 Z" fill="white" opacity="0.95" />
        </svg>
        <span class="brand-name">Rydo</span>
      </a>
      <!-- Navigation intentionally simplified for a focused booking experience -->
      <nav class="main-nav" aria-label="Primary">
        <!-- kept intentionally empty to avoid distracting links -->
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-copy">
          <h1 class="hero-title">Move your way.</h1>
          <p class="hero-sub">Safe rides. Simple booking.</p>
          <div class="cta-row">
            <button id="requestRide" class="btn btn-primary">Request a Ride</button>
            <button id="driverBtn" class="btn btn-outline">Driver</button>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="phone-mock">
            <div class="phone-screen">
              <div class="map-placeholder">Map preview coming soon</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Removed: Why choose Rydo? and How it works sections to keep the homepage focused on booking -->

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© <span id="year"></span> Rydo — Move your way.</div>
      <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
      </div>
    </div>
  </footer>

  <!-- Simple modal for button feedback -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <h3 id="modal-title">Coming soon</h3>
      <p id="modal-message">Feature coming in the next step.</p>
      <div class="modal-actions">
        <button id="modalClose" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>

  <!-- Ride request modal -->
  <div id="rideRequestModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="rideRequestTitle">
    <div class="modal-panel ride-modal-panel">
      <h3 id="rideRequestTitle">Request a Ride</h3>
      <form id="rideRequestForm">
        <div class="form-row">
          <label for="pickup">Pickup</label>
          <div class="pickup-row">
            <input id="pickup" name="pickup" type="text" placeholder="Enter pickup address or landmark" required />
            <button type="button" id="useLocationBtn" class="btn btn-outline small">Use my location</button>
          </div>
          <!-- hidden fields to store coordinates (kept to preserve existing form fields for Supabase) -->
          <input type="hidden" id="pickupLat" name="pickupLat" />
          <input type="hidden" id="pickupLon" name="pickupLon" />
        </div>
        <div class="form-row">
          <label for="dropoff">Drop-off</label>
          <input id="dropoff" name="dropoff" type="text" placeholder="Enter destination" required />
          <input type="hidden" id="dropoffLat" name="dropoffLat" />
          <input type="hidden" id="dropoffLon" name="dropoffLon" />
        </div>
        <div class="form-row">
          <label for="rideType">Ride type</label>
          <select id="rideType" name="rideType">
            <option value="bike">Bike</option>
            <option value="car">Car</option>
            <option value="tuktuk">Tuk Tuk</option>
          </select>
        </div>
        <div class="form-row small-row">
          <label for="passengers">Passengers</label>
          <input id="passengers" name="passengers" type="number" min="1" max="6" value="1" />
        </div>
        <div class="form-row">
          <label for="notes">Notes (optional)</label>
          <input id="notes" name="notes" type="text" placeholder="Add pickup notes, access info..." />
        </div>

        <!-- Distance & fare display -->
        <div id="rideInfo" class="ride-info" aria-live="polite">
          <div id="distanceDisplay">Distance: —</div>
          <div id="fareDisplay">Estimated Fare: Rs —</div>
        </div>

        <div class="form-actions">
          <button type="button" id="rideCancel" class="btn btn-outline">Cancel</button>
          <button type="submit" id="rideSubmit" class="btn btn-primary">Request Ride</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
