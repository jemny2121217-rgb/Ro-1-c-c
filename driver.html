<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rydo Driver Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      background: #111827;
      color: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
    }

    .tagline {
      color: #cbd5e1;
      margin-top: 4px;
      font-size: 13px;
    }

    .status-pill {
      padding: 8px 13px;
      border-radius: 999px;
      background: #374151;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-pill.online {
      background: #15803d;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 12px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-weight: 700;
      margin-top: 8px;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-primary:hover {
      background: #000;
    }

    .btn-success {
      background: #15803d;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .auth-switch {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
    }

    .auth-switch button {
      border: none;
      background: none;
      color: #2563eb;
      font-weight: 700;
    }

    .message {
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 13px;
      font-size: 14px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .driver-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      align-items: center;
    }

    .driver-name {
      font-size: 22px;
      font-weight: 800;
    }

    .vehicle {
      color: #64748b;
      margin-top: 4px;
      font-size: 14px;
    }

    .online-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle {
      width: 55px;
      height: 30px;
      background: #cbd5e1;
      border-radius: 30px;
      position: relative;
      border: none;
    }

    .toggle::after {
      content: "";
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      position: absolute;
      left: 3px;
      top: 3px;
      transition: 0.2s;
    }

    .toggle.active {
      background: #16a34a;
    }

    .toggle.active::after {
      left: 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f8fafc;
      border-radius: 13px;
      padding: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 23px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .ride {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .ride-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ride-title {
      font-weight: 800;
    }

    .ride-status {
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
    }

    .location {
      margin: 9px 0;
      font-size: 14px;
    }

    .location strong {
      display: inline-block;
      width: 80px;
    }

    .ride-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .ride-info-box {
      background: #f8fafc;
      padding: 9px;
      border-radius: 9px;
      text-align: center;
    }

    .ride-info-box small {
      display: block;
      color: #64748b;
      font-size: 11px;
    }

    .ride-info-box strong {
      display: block;
      margin-top: 3px;
    }

    .ride-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: #64748b;
      font-size: 14px;
    }

    .history-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 13px 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .earnings {
      font-weight: 800;
      color: #15803d;
    }

    .small {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .logout {
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 10px;
      }

      .header {
        border-radius: 14px;
        padding: 15px;
      }

      .brand {
        font-size: 23px;
      }

      .card {
        padding: 15px;
        border-radius: 15px;
      }

      .stats {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
      }

      .stat {
        padding: 12px 5px;
      }

      .stat-value {
        font-size: 18px;
      }

      .driver-top {
        grid-template-columns: 1fr;
      }

      .online-control {
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div>
      <div class="brand">Rydo</div>
      <div class="tagline">Safe rides. Simple booking.</div>
    </div>

    <div id="connectionStatus" class="status-pill">
      Connecting...
    </div>
  </header>


  <!-- AUTH AREA -->
  <section id="authArea">

    <!-- LOGIN -->
    <div id="loginCard" class="card">

      <h2>Driver Login</h2>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            required
            autocomplete="email"
            placeholder="driver@example.com"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Your password"
          >
        </div>

        <button class="btn btn-primary" type="submit">
          Login
        </button>

      </form>

      <div class="auth-switch">
        New driver?
        <button id="showRegisterBtn" type="button">
          Create account
        </button>
      </div>

    </div>


    <!-- REGISTER -->
    <div id="registerCard" class="card hidden">

      <h2>Driver Registration</h2>

      <div id="registerMessage" class="message"></div>

      <form id="registerForm">

        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input
            id="registerName"
            type="text"
            required
            placeholder="Full name"
          >
        </div>

        <div class="form-group">
          <label for="registerPhone">Phone</label>
          <input
            id="registerPhone"
            type="tel"
            required
            placeholder="98XXXXXXXX"
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            type="email"
            required
            placeholder="driver@example.com"
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input
            id="registerPassword"
            type="password"
            minlength="6"
            required
            placeholder="Minimum 6 characters"
          >
        </div>

        <div class="form-group">
          <label for="vehicleType">Vehicle Type</label>

          <select id="vehicleType" required>
            <option value="">Select vehicle</option>
            <option value="Bike">Bike</option>
            <option value="Car">Car</option>
            <option value="Tuk Tuk">Tuk Tuk</option>
          </select>

        </div>

        <button class="btn btn-primary" type="submit">
          Register
        </button>

      </form>

      <div class="auth-switch">
        Already registered?
        <button id="showLoginBtn" type="button">
          Login
        </button>
      </div>

    </div>

  </section>


  <!-- DRIVER DASHBOARD -->
  <main id="dashboard" class="hidden">


    <!-- DRIVER PROFILE -->
    <section class="card">

      <div class="driver-top">

        <div>
          <div id="driverName" class="driver-name">
            Driver
          </div>

          <div id="driverVehicle" class="vehicle">
            Vehicle
          </div>
        </div>

        <div class="online-control">

          <span id="onlineText">
            Offline
          </span>

          <button
            id="onlineToggle"
            class="toggle"
            type="button"
            aria-label="Toggle online status">
          </button>

        </div>

      </div>

    </section>


    <!-- STATISTICS -->
    <section class="card">

      <h2>Today's Summary</h2>

      <div class="stats">

        <div class="stat">
          <div id="todayRides" class="stat-value">
            0
          </div>

          <div class="stat-label">
            Rides
          </div>
        </div>

        <div class="stat">
          <div id="todayEarnings" class="stat-value">
            Rs 0
          </div>

          <div class="stat-label">
            Earnings
          </div>
        </div>

        <div class="stat">
          <div id="totalDistance" class="stat-value">
            0 km
          </div>

          <div class="stat-label">
            Distance
          </div>
        </div>

      </div>

    </section>


    <!-- ACTIVE RIDE -->
    <section id="activeRideCard" class="card hidden">

      <h2>Active Ride</h2>

      <div id="activeRide"></div>

    </section>


    <!-- REQUESTED RIDES -->
    <section class="card">

      <h2>Ride Requests</h2>

      <div id="rideRequests">

        <div class="empty">
          Go online to receive ride requests.
        </div>

      </div>

    </section>


    <!-- RIDE HISTORY -->
    <section class="card">

      <h2>Ride History</h2>

      <div id="rideHistory">

        <div class="empty">
          No completed rides yet.
        </div>

      </div>

    </section>


    <!-- LOGOUT -->
    <section class="card">

      <button
        id="logoutBtn"
        class="btn btn-danger logout"
        type="button">
        Logout
      </button>

    </section>

  </main>

</div>


<script>
/* =========================================================
   RYDO DRIVER PORTAL
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://pdfgqlvovmyzhdnumypq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_cZnuDJwbDbtF2dDJ_M6rCg_-e-nWdMX";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

const { createClient } = window.supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let currentUser = null;
let driverProfile = null;
let pollingTimer = null;
let isOnline = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const authArea =
  document.getElementById("authArea");

const dashboard =
  document.getElementById("dashboard");

const loginCard =
  document.getElementById("loginCard");

const registerCard =
  document.getElementById("registerCard");

const loginForm =
  document.getElementById("loginForm");

const registerForm =
  document.getElementById("registerForm");

const loginMessage =
  document.getElementById("loginMessage");

const registerMessage =
  document.getElementById("registerMessage");

const connectionStatus =
  document.getElementById("connectionStatus");

const driverName =
  document.getElementById("driverName");

const driverVehicle =
  document.getElementById("driverVehicle");

const onlineToggle =
  document.getElementById("onlineToggle");

const onlineText =
  document.getElementById("onlineText");

const rideRequests =
  document.getElementById("rideRequests");

const activeRideCard =
  document.getElementById("activeRideCard");

const activeRide =
  document.getElementById("activeRide");

const rideHistory =
  document.getElementById("rideHistory");

const todayRides =
  document.getElementById("todayRides");

const todayEarnings =
  document.getElementById("todayEarnings");

const totalDistance =
  document.getElementById("totalDistance");


/* =========================================================
   MESSAGE HELPERS
   ========================================================= */

function showMessage(element, message, type = "error") {

  element.textContent = message;

  element.className =
    "message show " + type;

}


function clearMessage(element) {

  element.textContent = "";

  element.className =
    "message";

}


/* =========================================================
   CONNECTION TEST
   ========================================================= */

async function testConnection() {

  try {

    const { error } =
      await db
        .from("rides")
        .select("id")
        .limit(1);

    if (error) {
      console.warn(
        "Supabase connection:",
        error.message
      );

      connectionStatus.textContent =
        "Supabase connected";
    } else {

      connectionStatus.textContent =
        "Connected";

    }

  } catch (error) {

    console.error(error);

    connectionStatus.textContent =
      "Connection error";
  }

}


/* =========================================================
   AUTH VIEW
   ========================================================= */

document
  .getElementById("showRegisterBtn")
  .addEventListener("click", () => {

    clearMessage(loginMessage);

    loginCard.classList.add("hidden");

    registerCard.classList.remove("hidden");

  });


document
  .getElementById("showLoginBtn")
  .addEventListener("click", () => {

    clearMessage(registerMessage);

    registerCard.classList.add("hidden");

    loginCard.classList.remove("hidden");

  });


/* =========================================================
   DRIVER REGISTRATION
   ========================================================= */

registerForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    clearMessage(registerMessage);

    const name =
      document
        .getElementById("registerName")
        .value
        .trim();

    const phone =
      document
        .getElementById("registerPhone")
        .value
        .trim();

    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("registerPassword")
        .value;

    const vehicle =
      document
        .getElementById("vehicleType")
        .value;

    if (!name || !phone || !email || !password || !vehicle) {

      showMessage(
        registerMessage,
        "Please complete all fields."
      );

      return;
    }


    const submitButton =
      registerForm.querySelector("button[type=submit]");

    submitButton.disabled = true;

    submitButton.textContent =
      "Creating account...";


    try {

      const {
        data,
        error
      } = await db.auth.signUp({

        email,
        password,

        options: {
          data: {
            full_name: name,
            phone: phone,
            role: "driver",
            vehicle_type: vehicle
          }
        }

      });


      if (error) {
        throw error;
      }


      /*
       * Create/update driver profile.
       *
       * This works when the profiles table allows the
       * authenticated user to insert/update their own row.
       */

      if (data.user) {

        const {
          error: profileError
        } = await db
          .from("profiles")
          .upsert({

            id: data.user.id,

            full_name: name,

            phone: phone,

            role: "driver"

          });


        if (profileError) {

          console.warn(
            "Profile insert warning:",
            profileError.message
          );

        }

      }


      showMessage(
        registerMessage,
        "Registration successful. Check your email if email confirmation is enabled, then login.",
        "success"
      );


      registerForm.reset();


      setTimeout(() => {

        registerCard.classList.add("hidden");

        loginCard.classList.remove("hidden");

      }, 1500);


    } catch (error) {

      console.error(error);

      showMessage(
        registerMessage,
        error.message || "Registration failed."
      );

    } finally {

      submitButton.disabled = false;

      submitButton.textContent =
        "Register";

    }

  }
);


/* =========================================================
   DRIVER LOGIN
   ========================================================= */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    clearMessage(loginMessage);

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;


    const submitButton =
      loginForm.querySelector("button[type=submit]");

    submitButton.disabled = true;

    submitButton.textContent =
      "Logging in...";


    try {

      const {
        data,
        error
      } = await db.auth.signInWithPassword({

        email,
        password

      });


      if (error) {
        throw error;
      }


      if (!data.user) {
        throw new Error("Login failed.");
      }


      currentUser =
